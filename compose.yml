services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: wget --spider http://127.0.0.1:5173/
      interval: 5s
    init: true # Kill children process
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: apps/backend/.env
    healthcheck:
      test: nc -z 127.0.0.1 3000
      interval: 5s
      start_period: 30s
    init: true # Kill children process
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
  nginx:
    build:
      context: ./apps/nginx
    ports:
      - 8080:8080
    depends_on:
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  lint:
    build:
      context: .
      dockerfile: apps/lint/Dockerfile
    profiles: ["ci"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  test:
    build:
      context: .
      dockerfile: apps/test/Dockerfile
    profiles: ["ci"]
    depends_on:
      lint:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
